name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m compileall engine.py main.py models.py backend
      - name: Lint fatal issues only (E9,F = syntax & undefined names)
        run: |
          pip install ruff
          ruff check . --select E9,F --extend-exclude frontend
