name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Lint fatal issues (syntax and undefined names)
        run: ruff check . --select E9,F --extend-exclude frontend
      - name: Check frontend syntax
        run: node --check frontend/app.js
      - name: Test
        run: pytest -q
