# Dated event sample.
#
# Labels (event_type / direction) are editorial and come from the official
# action plus the published consensus. They are *not* inferred from the market
# reaction. Outcomes are computed separately in evaluation/event_study.py.
#
# session:
#   before_open  -> event day is the same trading day
#   during       -> event day is the same trading day
#   after_close  -> event day is the next trading day
#   non_trading  -> event day is the next trading day (weekend/holiday)
#
# surprise.sign uses "positive = more of the event direction than expected"
# (a surprise cut and a surprise hike can both be positive).

