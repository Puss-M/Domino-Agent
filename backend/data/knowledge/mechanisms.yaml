# Domino Agent transmission library.
#
# This file is the "moat" layer: a curated, cited map from event types to
# transmission channels to asset loadings. It is intentionally small and
# auditable. An LLM may retrieve from it and narrate it, but may not invent a
# channel, a citation, or a sign.
#
# Conventions
# - channel score > 0 means "the channel variable rises" (e.g. real yields up).
# - loading > 0 means the asset tends to rise when the channel rises.
# - scale_bps is an illustrative 5-day magnitude, not an estimated elasticity.
#   It is used to produce an order-of-magnitude expected CAR, never a price target.
# - evidence_grade: A = peer-reviewed/official and directly applicable;
#   B = empirical support with regime/condition uncertainty; C = weak;
#   D = speculative (must never drive a headline prediction).

