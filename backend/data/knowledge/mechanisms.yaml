mechanisms:
  - id: MON_TIGHTEN
    title: Hawkish policy surprise lifts real yields and discount rates
    event_types: [monetary_policy]
    directions: [tightening, hawkish_hold]
    none_keywords: [emergency, bank failure, bank run, banking stress, financial stability, credit crunch, svb, recession]
    confidence: 0.82
    evidence_grade: A
    horizon_days: 5
    rationale: A policy surprise raises the expected path of real rates, lifts the dollar, and compresses long-duration equity valuations. Credit spreads widen modestly as refinancing conditions tighten.
    channels:
      real_yields: 0.9
      nominal_yields: 0.7
      discount_rates: 0.8
      usd: 0.6
      credit_spreads: 0.3
      risk_premium: 0.2
    citations:
      - "Bernanke & Kuttner (2005), Journal of Finance 60(3)"
      - "Gürkaynak, Sack & Swanson (2005), International Journal of Central Banking"
      - "Nakamura & Steinsson (2018), Quarterly Journal of Economics 133(3)"

  - id: MON_TIGHTEN_STRESS
    title: Tightening into a fragile banking system
    event_types: [monetary_policy]
    directions: [tightening, hawkish_hold]
    any_keywords: [bank failure, bank run, banking stress, financial stability, credit crunch, svb, crisis]
    confidence: 0.66
    evidence_grade: B
    horizon_days: 5
    rationale: When a hike lands alongside bank stress, the rate channel and the funding-liquidity channel push in opposite directions for some assets; safe havens and credit spreads dominate the cross-section.
    channels:
      real_yields: 0.5
      discount_rates: 0.4
      risk_premium: 0.6
      safe_haven: 0.5
      credit_spreads: 0.5
      funding_liquidity: 0.5
    citations:
