      - "Caldara & Iacoviello (2022), American Economic Review 112(4)"

  - id: MON_EASE_INSURANCE
    title: Insurance easing supports duration and risk assets
    event_types: [monetary_policy]
    directions: [easing, dovish_hold]
    none_keywords: [emergency, crisis, recession, bank failure, bank run, financial stability, pandemic, unemployment, fewer cuts, higher for longer, hawkish, sticky inflation, slower easing]
    confidence: 0.72
    evidence_grade: B
    horizon_days: 5
    rationale: A cut that is not forced by a growth or funding shock lowers the expected policy path, compresses discount rates, and weakens the dollar. The risk premium channel is mildly supportive.
    channels:
      real_yields: -0.8
      nominal_yields: -0.6
      discount_rates: -0.7
      usd: -0.5
      credit_spreads: -0.3
      risk_premium: -0.3
      growth_expectations: 0.2
    citations:
      - "Bernanke & Kuttner (2005), Journal of Finance 60(3)"
      - "Gürkaynak, Sack & Swanson (2005), International Journal of Central Banking"

  - id: MON_EASE_STRESS
    title: Emergency easing signals a growth or funding shock
    event_types: [monetary_policy]
    directions: [easing]
    any_keywords: [emergency, crisis, recession, bank failure, bank run, financial stability, pandemic, unemployment, credit crunch]
    confidence: 0.78
    evidence_grade: B
    horizon_days: 5
    rationale: An emergency cut is a signal that the central bank sees a shock. The rate cut helps duration, but the funding-liquidity and risk-premium channels dominate equities and credit at short horizons.
    channels:
      real_yields: -0.7
      funding_liquidity: 0.9
      safe_haven: 0.6
      risk_premium: 0.6
      credit_spreads: 0.5
      discount_rates: -0.3
    citations:
      - "Bernanke, Gertler & Gilchrist (1999), Handbook of Macroeconomics"
      - "Caldara & Iacoviello (2022), American Economic Review 112(4)"

  - id: HAWKISH_CUT
    title: A cut with hawkish guidance is a de facto tightening signal
    event_types: [monetary_policy]
    directions: [easing]
    any_keywords: [fewer cuts, higher for longer, hawkish, sticky inflation, slower easing]
    confidence: 0.62
    evidence_grade: B
    horizon_days: 5
    rationale: "The policy action is a cut, but the guidance raises the expected future path. Markets trade the path, not the announcement; duration and growth equities can sell off even as the spot rate falls."
    channels:
      real_yields: 0.5
      discount_rates: 0.4
      usd: 0.4
      risk_premium: 0.3
      credit_spreads: 0.2
    citations:
