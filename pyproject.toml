[project]
name = "domino-agent"
version = "0.6.0"
description = "Event-driven macro transmission with cited mechanisms and an event-study backtest"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Puss-M" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "requests>=2.31,<3",
    "PyYAML>=6.0,<7",
    "ftfy>=6.2,<7",
    "z3-solver>=4.12,<5",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv", "backend/.cache", "frontend", "docs"]

[tool.ruff.lint]
select = ["E9", "F"]
